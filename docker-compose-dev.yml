services:
  db:
    container_name: ml-products-grouping-db
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - 5432:5432

  aws:
    container_name: ml-products-grouping-aws
    image: localstack/localstack
    ports:
      - 4566:4566

    environment:
      - SERVICES=sqs
      - DEBUG=1
      - DATA_DIR=/var/lib/localstack/data
      - DOCKER_HOST=unix:///var/run/docker.sock

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - localstack_data:/var/lib/localstack/data

  minio:
    image: minio/minio:RELEASE.2025-04-03T14-56-28Z

    container_name: ml-products-grouping-minio
    ports:
      - 9000:9000
      - 9001:9001

    environment:
      MINIO_ROOT_USER: miniouser
      MINIO_ROOT_PASSWORD: miniopassword

    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s

    command: server /data --address 0.0.0.0:9000 --console-address :9001
    volumes:
      - minio_data:/data

  createbucket:
    image: minio/mc:RELEASE.2025-03-12T17-29-24Z

    depends_on:
      minio:
        condition: service_healthy

    environment:
      MINIO_AWS_BUCKET_NAME: ${MINIO_AWS_BUCKET_NAME}

    entrypoint: >
      sh -c "
      mc config host add --quiet --api s3v4 minio http://minio:9000 miniouser miniopassword;
      mc rb --force minio/$${MINIO_AWS_BUCKET_NAME} || true;
      mc mb --quiet minio/$${MINIO_AWS_BUCKET_NAME};
      "
    restart: "no"

volumes:
  postgres_data:
  localstack_data:
  minio_data:
